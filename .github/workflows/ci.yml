name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (no integration features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace
      # Every library's default-feature unit tests. Network/filesystem smoke
      # suites are gated by each crate's opt-in `integration` feature and must
      # never be enabled in this workflow.
      - run: cargo test --workspace --lib
      - run: cargo doc --workspace --no-deps
