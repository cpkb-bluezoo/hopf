[package]
name = "hopf-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Real rustls interop test harness for hopf-core::tls (thin re-export shim; not a production dependency of any other crate)"
readme = "README.md"
keywords = ["tls", "server"]
categories = ["network-programming", "cryptography"]

[features]
default = []
# TLS echo / STARTTLS Runtime smokes; not compiled in CI.
integration = []

[dependencies]
hopf-core = { workspace = true }

[dev-dependencies]
# Test peer only, to prove wire interop with a real independent TLS 1.3
# implementation — hopf-tls's own runtime code no longer touches rustls.
rustls = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
