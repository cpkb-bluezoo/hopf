[package]
name = "hopf-amqp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "AMQP 0-9-1 async client for Hopf (RabbitMQ)"
readme = "README.md"
keywords = ["amqp", "rabbitmq", "messaging", "networking"]
categories = ["network-programming"]

[features]
default = []
# Opt-in RabbitMQ integration tests. CI runs unit tests without this
# feature; run manually with `cargo test -p hopf-amqp --features integration`.
integration = []

[dependencies]
hopf-core = { workspace = true }
hopf-auth = { workspace = true }
hopf-tls = { workspace = true }
hopf-dns = { workspace = true }
