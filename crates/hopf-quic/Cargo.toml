[package]
name = "hopf-quic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "QUIC transport for Hopf (quinn-proto + mio; no HTTP)"
readme = "README.md"
keywords = ["quic", "quinn-proto", "mio"]
categories = ["network-programming"]

[features]
default = []
# QUIC listen/connect smokes; not compiled in CI.
integration = []

[dependencies]
hopf-core = { workspace = true }
hopf-tls = { workspace = true }
quinn-proto = { workspace = true }
# See the workspace root Cargo.toml's comment on this entry — pins a
# transitive quinn-proto dependency away from a broken release, not
# something hopf-quic's own code uses.
tinyvec = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
mio = { workspace = true }
bytes = "1"
rcgen = { workspace = true }
socket2 = { workspace = true }
libc = "0.2"

[dev-dependencies]
