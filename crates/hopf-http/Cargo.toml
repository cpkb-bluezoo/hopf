[package]
name = "hopf-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "HTTP Stream codecs and server/client handlers for Hopf"
readme = "README.md"
keywords = ["http", "networking", "streaming"]
categories = ["network-programming", "web-programming::http-client", "web-programming::http-server"]

[features]
default = []
h3 = ["dep:hopf-quic"]
# Auth Runtime + H3 QUIC smokes; not compiled in CI.
integration = ["h3"]

[dependencies]
hopf-core = { workspace = true }
hopf-auth = { workspace = true }
hopf-quic = { workspace = true, optional = true }
# Declared for WebDAV / composition XML and protocol payloads (wired in later tranches).
tractrix = { workspace = true }
rjsonparser = { workspace = true }
rmimeparser = { workspace = true }
rprotobuf = { workspace = true }

[dev-dependencies]
hopf-tls = { workspace = true }
rcgen = { workspace = true }
