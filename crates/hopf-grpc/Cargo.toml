[package]
name = "hopf-grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "gRPC framing, ProtoFile model, and HTTP Stream binding for Hopf"
readme = "README.md"
keywords = ["grpc", "protobuf", "http", "networking"]
categories = ["network-programming", "web-programming::http-server"]

[features]
default = []
# Interoperability tests against grpcio in a container (tests/grpcio_interop.rs);
# CI does not enable integration features. Run manually with
# `cargo test -p hopf-grpc --features integration --test grpcio_interop`.
integration = []

[dependencies]
hopf-core = { workspace = true }
hopf-http = { workspace = true }
rjsonparser = { workspace = true }
rprotobuf = { workspace = true }

[dev-dependencies]
hopf-core = { workspace = true }
