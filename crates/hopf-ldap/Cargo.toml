[package]
name = "hopf-ldap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "LDAPv3 client and CredentialStore (Gumdrop ldap.asn1 + LDAPRealm port)"
readme = "README.md"
keywords = ["ldap", "ber", "asn1", "auth", "sasl"]
categories = ["network-programming", "authentication"]

[features]
default = []
# Tests that use real files or sockets; excluded from CI
# unit-test runs.
integration = []

[dependencies]
hopf-core = { workspace = true }
hopf-auth = { workspace = true }

[dev-dependencies]
hopf-core = { workspace = true, features = ["testing"] }
