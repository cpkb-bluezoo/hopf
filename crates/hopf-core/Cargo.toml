[package]
name = "hopf-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Thread-per-core reactor, Endpoint, and ProtocolHandler substrate for Hopf"
readme = "README.md"
keywords = ["async", "nio", "server", "mio"]
categories = ["network-programming", "asynchronous"]

[features]
default = []
# Runtime/TCP smokes; not compiled in CI (`cargo test --lib` without this feature).
integration = []

[dependencies]
mio = { workspace = true }
tractrix = { workspace = true }
bytes = "1"
getrandom = { workspace = true }

[target.'cfg(unix)'.dependencies]
# UNIX domain socket peer credentials (SO_PEERCRED / getpeereid).
libc = "0.2"
