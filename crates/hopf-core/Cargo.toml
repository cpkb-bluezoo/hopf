[package]
name = "hopf-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Thread-per-core reactor, Endpoint, and ProtocolHandler substrate for Hopf"
readme = "README.md"
keywords = ["async", "nio", "server", "mio"]
categories = ["network-programming", "asynchronous"]

[dependencies]
mio = { workspace = true }
tractrix = { workspace = true }
bytes = "1"
getrandom = { workspace = true }
aws-lc-rs = { workspace = true }
rustls-pemfile = { workspace = true }
ed448-goldilocks-plus = { version = "0.18.0", default-features = false, features = ["signing"], optional = true }

[dev-dependencies]
rcgen = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
# Ed448 DNSSEC verify (RFC 8080) — AWS-LC has no Ed448.
ed448 = ["dep:ed448-goldilocks-plus"]
# Runtime/TCP smokes; not compiled in CI (`cargo test --lib` without this feature).
integration = []

[target.'cfg(unix)'.dependencies]
# UNIX domain socket peer credentials (SO_PEERCRED / getpeereid).
libc = "0.2"
