[package]
name = "hopf-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "DNS stub resolver and caching forwarder for Hopf (UDP/TCP/DoT/DoQ/DoH)"
readme = "README.md"
keywords = ["dns", "resolver", "dot", "doq", "doh"]
categories = ["network-programming"]
autotests = false

[features]
default = []
server = []
dot = ["dep:hopf-tls"]
doq = ["dep:hopf-quic"]
doh = ["dep:hopf-tls"]
dnssec = ["dep:ring"]
# Local UDP stub ↔ resolver smokes (`tests/`); not compiled in CI `--lib`.
integration = []

[dependencies]
hopf-core = { workspace = true }
mio = { workspace = true }
getrandom = { workspace = true }
hopf-tls = { workspace = true, optional = true }
hopf-quic = { workspace = true, optional = true }
ring = { version = "0.17", optional = true }

[dev-dependencies]
rcgen = { workspace = true }

[[test]]
name = "resolver_stub"
path = "tests/resolver_stub.rs"
required-features = ["integration"]
