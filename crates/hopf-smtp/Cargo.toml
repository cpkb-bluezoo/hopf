[package]
name = "hopf-smtp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "SMTP / SMTPS server and client for Hopf (Gumdrop smtp port)"
readme = "README.md"
keywords = ["smtp", "smtps", "email", "networking"]
categories = ["network-programming", "email"]

[features]
default = []
# Opt-in loopback TCP/TLS/DNS/filesystem smoke tests. CI runs unit tests without
# this feature; run manually with `cargo test -p hopf-smtp --features integration`.
integration = []

[dependencies]
hopf-core = { workspace = true }
hopf-auth = { workspace = true }
hopf-tls = { workspace = true }
hopf-otel = { workspace = true }
hopf-dns = { workspace = true }
hopf-mailbox = { workspace = true }
rmimeparser = { workspace = true }
ring = "0.17"
getrandom = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
