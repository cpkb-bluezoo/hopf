[workspace]
resolver = "2"
members = [
    "crates/hopf",
    "crates/hopf-core",
    "crates/hopf-tls",
    "crates/hopf-http",
    "crates/hopf-quic",
    "crates/hopf-dns",
    "crates/hopf-mdns",
    "crates/hopf-auth",
    "crates/hopf-ldap",
    "crates/hopf-otel",
    "crates/hopf-webdav",
    "crates/hopf-websocket",
    "crates/hopf-masque",
    "crates/hopf-socks",
    "crates/hopf-grpc",
    "crates/hopf-ftp",
    "crates/hopf-smtp",
    "crates/hopf-mailbox",
    "crates/hopf-pop3",
    "crates/hopf-imap",
    "crates/hopf-nntp",
    "crates/hopf-mqtt",
    "crates/hopf-amqp",
    "crates/hopf-amqp1",
    "examples/echo",
    "examples/tls-echo",
    "examples/http-hello",
    "examples/http-get",
    "examples/http3-hello",
    "examples/quic-interop",
    "examples/dns-authoritative",
    "examples/dns-proxy",
    "examples/webdav",
    "examples/websocket",
    "examples/grpc",
    "examples/ftp",
    "examples/ftp-get",
    "examples/smtp",
    "examples/smtp-ldap",
    "examples/smtp-local",
    "examples/smtp-send",
    "examples/pop3",
    "examples/pop3-fetch",
    "examples/imap",
    "examples/imap-fetch",
    "examples/composition-xml",
    "examples/mail-composed",
    "examples/mqtt",
    "examples/mqtt-pub",
    "examples/amqp-pub",
    "examples/amqp-consume",
]
default-members = [
    "crates/hopf",
    "crates/hopf-core",
    "crates/hopf-tls",
    "crates/hopf-http",
    "crates/hopf-quic",
    "crates/hopf-dns",
    "crates/hopf-mdns",
    "crates/hopf-auth",
    "crates/hopf-ldap",
    "crates/hopf-otel",
    "crates/hopf-webdav",
    "crates/hopf-websocket",
    "crates/hopf-masque",
    "crates/hopf-socks",
    "crates/hopf-grpc",
    "crates/hopf-ftp",
    "crates/hopf-smtp",
    "crates/hopf-mailbox",
    "crates/hopf-pop3",
    "crates/hopf-imap",
    "crates/hopf-nntp",
    "crates/hopf-mqtt",
    "crates/hopf-amqp",
    "crates/hopf-amqp1",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
license = "LGPL-3.0-or-later"
homepage = "https://cpkb-bluezoo.github.io/hopf/"
repository = "https://github.com/cpkb-bluezoo/hopf"
authors = ["Chris Burdess <dog@gnu.org>"]

[workspace.dependencies]
mio = { version = "1", features = ["net", "os-poll", "os-ext"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"] }
# Public WebPKI trust: OS trust store at runtime, with a vendored fallback
# for environments where the native store can't be read.
rustls-native-certs = "0.8"
webpki-roots = "1"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# Each of the crates developed alongside hopf is a `path` dependency with the
# `version` of its next, unreleased release, so that hopf builds against the
# local sources and can only be published once those releases exist. A bare
# registry version could be satisfied by an older release without the
# changes hopf now depends on.
tractrix = { version = "0.3", path = "../tractrix" }
self_cell = "1"
rjsonparser = { version = "0.3", path = "../rjsonparser" }
loopbuf = { version = "0.2", path = "../loopbuf" }
rmimeparser = { version = "0.6", path = "../rmimeparser" }
rprotobuf = { version = "0.2", path = "../rprotobuf" }
# Internal crates: `version` must match [workspace.package] version (required
# for publishing; cargo cannot inherit it here). Bump together on release.
hopf-core = { version = "0.6.0", path = "crates/hopf-core" }
hopf-http = { version = "0.6.0", path = "crates/hopf-http" }
hopf-quic = { version = "0.6.0", path = "crates/hopf-quic" }
hopf-dns = { version = "0.6.0", path = "crates/hopf-dns" }
hopf-mdns = { version = "0.6.0", path = "crates/hopf-mdns" }
hopf-auth = { version = "0.6.0", path = "crates/hopf-auth" }
hopf-ldap = { version = "0.6.0", path = "crates/hopf-ldap" }
hopf-otel = { version = "0.6.0", path = "crates/hopf-otel" }
hopf-webdav = { version = "0.6.0", path = "crates/hopf-webdav" }
hopf-websocket = { version = "0.6.0", path = "crates/hopf-websocket" }
hopf-masque = { version = "0.6.0", path = "crates/hopf-masque" }
hopf-socks = { version = "0.6.0", path = "crates/hopf-socks" }
hopf-grpc = { version = "0.6.0", path = "crates/hopf-grpc" }
hopf-ftp = { version = "0.6.0", path = "crates/hopf-ftp" }
hopf-smtp = { version = "0.6.0", path = "crates/hopf-smtp" }
hopf-mailbox = { version = "0.6.0", path = "crates/hopf-mailbox" }
hopf-pop3 = { version = "0.6.0", path = "crates/hopf-pop3" }
hopf-imap = { version = "0.6.0", path = "crates/hopf-imap" }
hopf-nntp = { version = "0.6.0", path = "crates/hopf-nntp" }
hopf-mqtt = { version = "0.6.0", path = "crates/hopf-mqtt" }
hopf-amqp = { version = "0.6.0", path = "crates/hopf-amqp" }
hopf-amqp1 = { version = "0.6.0", path = "crates/hopf-amqp1" }
getrandom = "0.2"
tempfile = "3"
socket2 = { version = "0.5", features = ["all"] }
