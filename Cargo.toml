[workspace]
resolver = "2"
members = [
    "crates/hopf",
    "crates/hopf-core",
    "crates/hopf-tls",
    "crates/hopf-http",
    "crates/hopf-quic",
    "crates/hopf-dns",
    "crates/hopf-mdns",
    "crates/hopf-auth",
    "crates/hopf-ldap",
    "crates/hopf-otel",
    "crates/hopf-webdav",
    "crates/hopf-websocket",
    "crates/hopf-masque",
    "crates/hopf-grpc",
    "crates/hopf-ftp",
    "crates/hopf-smtp",
    "crates/hopf-mailbox",
    "crates/hopf-pop3",
    "crates/hopf-imap",
    "crates/hopf-mqtt",
    "crates/hopf-amqp",
    "examples/echo",
    "examples/tls-echo",
    "examples/http-hello",
    "examples/http-get",
    "examples/http3-hello",
    "examples/dns-proxy",
    "examples/webdav",
    "examples/websocket",
    "examples/grpc",
    "examples/ftp",
    "examples/ftp-get",
    "examples/smtp",
    "examples/smtp-ldap",
    "examples/smtp-local",
    "examples/smtp-send",
    "examples/pop3",
    "examples/pop3-fetch",
    "examples/imap",
    "examples/imap-fetch",
    "examples/composition-xml",
    "examples/mail-composed",
    "examples/mqtt",
    "examples/mqtt-pub",
    "examples/amqp-pub",
    "examples/amqp-consume",
    "examples/tlsa-record",
]
default-members = [
    "crates/hopf",
    "crates/hopf-core",
    "crates/hopf-tls",
    "crates/hopf-http",
    "crates/hopf-quic",
    "crates/hopf-dns",
    "crates/hopf-mdns",
    "crates/hopf-auth",
    "crates/hopf-ldap",
    "crates/hopf-otel",
    "crates/hopf-webdav",
    "crates/hopf-websocket",
    "crates/hopf-masque",
    "crates/hopf-grpc",
    "crates/hopf-ftp",
    "crates/hopf-smtp",
    "crates/hopf-mailbox",
    "crates/hopf-pop3",
    "crates/hopf-imap",
    "crates/hopf-mqtt",
    "crates/hopf-amqp",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "LGPL-2.1-or-later"
homepage = "https://cpkb-bluezoo.github.io/hopf/"
repository = "https://github.com/cpkb-bluezoo/hopf"
authors = ["Chris Burdess <dog@gnu.org>"]

[workspace.dependencies]
mio = { version = "1", features = ["net", "os-poll", "os-ext"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# QUIC transport state machine (mio/TPC glue in-tree; not the full `quinn` crate)
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-aws-lc-rs", "bloom", "log"] }
# Not used directly — quinn-proto pulls this in transitively. Pinned here
# only to force the resolver away from 1.13.0, which fails to compile
# ("cannot find macro `vec` in this scope" in its own `alloc`-feature code,
# an upstream regression). Cargo.lock is intentionally not committed, so
# every build re-resolves to the latest compatible versions otherwise.
# Remove once a working tinyvec > 1.13.0 is published.
tinyvec = "=1.12.0"
tractrix = "0.2"
self_cell = "1"
rjsonparser = "0.1"
rmimeparser = "0.4"
rprotobuf = "0.1"
# Internal crates: `version` must match [workspace.package] version (required
# for publishing; cargo cannot inherit it here). Bump together on release.
hopf-core = { version = "0.2.1", path = "crates/hopf-core" }
hopf-tls = { version = "0.2.1", path = "crates/hopf-tls" }
hopf-http = { version = "0.2.1", path = "crates/hopf-http" }
hopf-quic = { version = "0.2.1", path = "crates/hopf-quic" }
hopf-dns = { version = "0.2.1", path = "crates/hopf-dns" }
hopf-mdns = { version = "0.2.1", path = "crates/hopf-mdns" }
hopf-auth = { version = "0.2.1", path = "crates/hopf-auth" }
hopf-ldap = { version = "0.2.1", path = "crates/hopf-ldap" }
hopf-otel = { version = "0.2.1", path = "crates/hopf-otel" }
hopf-webdav = { version = "0.2.1", path = "crates/hopf-webdav" }
hopf-websocket = { version = "0.2.1", path = "crates/hopf-websocket" }
hopf-masque = { version = "0.2.1", path = "crates/hopf-masque" }
hopf-grpc = { version = "0.2.1", path = "crates/hopf-grpc" }
hopf-ftp = { version = "0.2.1", path = "crates/hopf-ftp" }
hopf-smtp = { version = "0.2.1", path = "crates/hopf-smtp" }
hopf-mailbox = { version = "0.2.1", path = "crates/hopf-mailbox" }
hopf-pop3 = { version = "0.2.1", path = "crates/hopf-pop3" }
hopf-imap = { version = "0.2.1", path = "crates/hopf-imap" }
hopf-mqtt = { version = "0.2.1", path = "crates/hopf-mqtt" }
hopf-amqp = { version = "0.2.1", path = "crates/hopf-amqp" }
getrandom = "0.2"
tempfile = "3"
socket2 = { version = "0.5", features = ["all"] }
